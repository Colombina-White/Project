<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Camera Link · 即時相機</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header><a class="brand" href="./"><span class="brand-icon">◉</span> CAMERA LINK</a><span class="tag">即時影像控制台</span></header>
    <section class="intro"><p class="eyebrow">YOUR SPACE, LIVE.</p><h1>讓畫面，<br>即刻連線。</h1><p>連接你的相機，透過瀏覽器觀看即時影像。</p></section>
    <div class="workspace">
      <section class="viewer" aria-label="相機畫面">
        <div class="viewer-bar"><span><span id="status-dot" class="dot"></span><span id="status" role="status" aria-live="polite">尚未連線</span></span><span>CAM 01</span></div>
        <div class="screen" id="screen">
          <video id="video" autoplay playsinline muted aria-label="相機即時影像"></video>
          <div id="placeholder" class="placeholder"><span class="camera-icon">◎</span><h2>等待你的第一個畫面</h2><p>輸入串流網址，開始觀看。</p></div>
          <span class="live" id="live" hidden>● LIVE</span>
        </div>
        <div class="viewer-footer"><span id="resolution">WebRTC 即時串流</span><div><button id="snapshot" class="small" disabled>儲存畫面</button><button id="fullscreen" class="small" disabled>全螢幕</button></div></div>
      </section>
      <aside>
        <form id="connect-form" class="card">
          <p class="eyebrow">CONNECTION</p><h2>連接相機</h2>
          <label for="endpoint">WebRTC 串流網址</label>
          <input id="endpoint" type="url" required placeholder="https://stream.example.com/cam/whep" autocomplete="off" spellcheck="false" aria-describedby="endpoint-help">
          <p class="help" id="endpoint-help">填入 MediaMTX 的 WHEP 網址，結尾為 <code>/cam/whep</code>。</p>
          <button id="connect" class="primary" type="submit">連接影像 <span>↗</span></button>
          <button id="disconnect" type="button" class="secondary" disabled>中斷連線</button>
          <p id="message" class="message" role="status" aria-live="polite">準備好後，按下「連接影像」。</p>
        </form>
        <div class="note"><span>↳</span><div><h3>從相機到你的螢幕</h3><p>相機與串流服務需保持開啟。首次設定方式請參閱專案的 README。</p></div></div>
      </aside>
    </div>
    <footer><span>CAMERA LINK / 個人影像工作站</span><span>POWERED BY WEBRTC</span></footer>
  </main>
</body>
</html>
